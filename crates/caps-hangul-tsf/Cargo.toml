[package]
name = "caps-hangul-tsf"
version = "0.1.4"
edition = "2021"
description = "포커스 스레드에 주입돼 in-process 로 IME 한/영 변환 모드를 읽는 TSF 리더 DLL"
license = "MIT"

# WH_GETMESSAGE 훅으로 대상(포커스) 프로세스에 주입되는 DLL.
# 대상 프로세스 비트니스에 맞춰야 하므로 x86/x64/arm64 세 종을 빌드하며, 산출물 이름은
# 빌드 후 아키텍처 접미사로 리네이밍해 배포한다:
#   caps_hangul_tsf.dll → caps-hangul-tsf-{x86|x64|arm64}.dll
[lib]
name = "caps_hangul_tsf"
crate-type = ["cdylib"]

[build-dependencies]
# 버전 정보(VERSIONINFO)를 DLL 에 임베드한다(build.rs) → 파일 속성 "자세히" 탭 표시.
# Windows SDK 의 rc.exe(MSVC 빌드에 이미 동봉)를 사용한다.
embed-resource = "3.0.9"

[dependencies]
# COM/TSF 를 다루므로 본체(windows-sys)와 달리 상위 래퍼 crate(windows)를 쓴다.
windows = { version = "0.62.2", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
