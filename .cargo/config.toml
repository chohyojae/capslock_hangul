# 회사 네트워크(SSL inspection 프록시) 환경에서 crates.io 다운로드 시
# 인증서 파기 검사(CRYPT_E_NO_REVOCATION_CHECK)로 실패하는 것을 우회한다.
# 일반 네트워크 환경에서 빌드한다면 이 파일을 삭제해도 무방하다.
[http]
check-revoke = false

# 기본 타겟은 호스트(보통 x64)다. 따라서 `cargo run` / `cargo build` / `cargo test`
# 가 별도 옵션 없이 그대로 동작한다.
#
# 구동 환경 목표는 x64 / aarch64 두 가지이며, 두 타겟을 한 번에 빌드할 때는
# 아래 build-all 별칭을 쓴다(`--release` 등 옵션을 뒤에 붙일 수 있다).
#   cargo build-all              → 두 타겟 모두
#   cargo build-x64 / -aarch64   → 한쪽만
#
# 타겟을 명시하면 산출물 경로가 target/release/ 가 아니라
# target/<아키텍처>-pc-windows-msvc/release/ 로 바뀐다.
#   - target/x86_64-pc-windows-msvc/release/caps-hangul.exe
#   - target/aarch64-pc-windows-msvc/release/caps-hangul.exe
#
# 선행 조건(aarch64 까지 빌드할 때):
#   rustup target add x86_64-pc-windows-msvc aarch64-pc-windows-msvc
#   (aarch64 cross-link 에는 VS "MSVC v143 - ARM64 빌드 도구" 컴포넌트 필요)
[alias]
build-all = "build --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc"
build-x64 = "build --target x86_64-pc-windows-msvc"
build-aarch64 = "build --target aarch64-pc-windows-msvc"
