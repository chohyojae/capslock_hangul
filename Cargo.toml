[package]
name = "caps-hangul-rs"
version = "0.1.0"
edition = "2021"
description = "Windows Caps Lock 한/영 전환 유틸리티 (짧게 누름: 한/영, 길게 누름: Caps Lock)"
license = "MIT"

# 워크스페이스 멤버:
#   - crates/caps-hangul-tsf    : 포커스 스레드에 주입되는 TSF 리더 DLL
#   - crates/caps-hangul-reader : 다른 비트니스 포커스 프로세스용 주입 헬퍼(브로커) exe
# 본체 exe 와 같은 출력 폴더(target/<profile>)에 .dll/.exe 가 떨어지며, 배포 시 exe 옆에 동봉한다.
#
# default-members 에 본체(".")와 두 멤버를 모두 넣어 `cargo build`/`cargo test`/빌드 별칭이
# exe·dll·reader 를 같은 출력 폴더에 함께 만들도록 한다. (비-virtual 워크스페이스는 default-members
# 미지정 시 루트 패키지만 빌드하므로 DLL/헬퍼가 누락되고 IME 리더가 추정값 폴백으로만 동작한다.)
# 단, `cargo run` 은 본체 바이너리의 의존성 그래프만 빌드하므로 멤버를 만들지 않는다(README 참조).
[workspace]
members = ["crates/caps-hangul-tsf", "crates/caps-hangul-reader"]
default-members = [".", "crates/caps-hangul-tsf", "crates/caps-hangul-reader"]

# 배포 산출물 이름은 설계 문서(§13.4)의 caps-hangul.exe 에 맞춘다.
[[bin]]
name = "caps-hangul"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_System_Threading",
  "Win32_System_SystemInformation",  # GetTickCount64
  "Win32_System_LibraryLoader",  # GetModuleHandleW
  "Win32_Security",              # SECURITY_ATTRIBUTES (CreateMutexW)
  "Win32_Graphics_Gdi",          # HUD 오버레이 렌더링 (폰트, 브러시, 둥근 사각형, 모니터)
  "Win32_UI_HiDpi",              # Per-Monitor DPI 인식 + 모니터 DPI 조회
  "Win32_System_Memory",         # named shared memory (주입 DLL 과의 IPC 채널)
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
# panic = "abort" 는 의도적으로 빼 둔다.
# 주입 DLL(crates/caps-hangul-tsf)이 Teams 등 *남의 프로세스* 안에서 실행되므로,
# 그 안의 패닉은 catch_unwind 로 잡아 호스트 프로세스를 죽이지 않아야 한다.
# panic="abort" 면 catch_unwind 가 무력화되어(즉시 abort) 호스트가 함께 종료된다.
# (workspace profile 은 전 멤버에 적용되어 DLL 만 따로 unwind 로 둘 수 없다.)
strip = true
