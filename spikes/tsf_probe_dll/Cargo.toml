[package]
name = "tsf_probe_dll"
version = "0.1.0"
edition = "2021"

# WH_GETMESSAGE 훅으로 대상 프로세스에 주입될 DLL.
[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Ole",
  "Win32_System_Variant",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_UI_TextServices",
  "Win32_UI_WindowsAndMessaging",
] }
