# 스파이크 #2 전용 워크스페이스 (본체 크레이트와 완전 분리).
#
# 목적: 선택지 A("포커스 프로세스에 in-process TSF 리더 주입")의 핵심 미지수를 실측 검증한다.
#   → 대상(Teams 등) 프로세스의 UI 스레드 안에서 실행되는 코드가 그 스레드의 실제 한/영
#     변환 모드(IME_CMODE_NATIVE)를 읽어낼 수 있는가?
#
# 이 워크스페이스는 루트 패키지(caps-hangul-rs)와 무관하며, 빌드/실행은 spikes/ 안에서만 한다:
#   cd spikes
#   cargo build
#   cargo run -p inject_driver
[workspace]
resolver = "2"
members = ["tsf_probe_dll", "inject_driver"]
